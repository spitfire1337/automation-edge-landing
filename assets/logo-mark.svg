<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="markTitle">
  <title id="markTitle">The Automation Edge mark</title>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="55%" stop-color="#1f3d73"/>
      <stop offset="100%" stop-color="#2f7dff"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3ff"/>
      <stop offset="45%" stop-color="#8fc0ff"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="bolt-highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="mark-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0b0e14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- badge: rounded circular mark with navy-to-electric-blue gradient -->
  <circle cx="32" cy="32" r="31" fill="url(#bg-grad)" stroke="#5fa2ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#0b0e14" stroke-opacity="0.35" stroke-width="1"/>

  <g filter="url(#mark-shadow)">
    <!-- crisp custom bolt: clean angular geometry, tighter and more vertical than a generic zigzag -->
    <path d="M 34 14 L 24 34 L 31 34 L 28 50 L 42 28 L 34 28 Z" fill="url(#bolt-grad)"/>
    <!-- inner highlight sliver for depth/bevel -->
    <path d="M 34 14 L 24 34 L 29 34 L 34 22 Z" fill="url(#bolt-highlight)"/>
  </g>
</svg>
