<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">The Automation Edge</title>
  <desc id="logoDesc">Logo for The Automation Edge — AI automation playbooks for small business</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171a21"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fb0ff"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>

  <!-- icon: rounded square badge with angular "edge" bolt -->
  <g transform="translate(0,8)">
    <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg-grad)" stroke="#2a2f3a" stroke-width="1.5"/>
    <path d="M 27 12 L 40 12 L 27 30 L 36 30 L 22 52 L 26 33 L 17 33 Z" fill="url(#bolt-grad)"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(78,0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="0" y="36" font-size="26" font-weight="700" fill="#eef1f5">The Automation</text>
    <text x="0" y="64" font-size="26" font-weight="700" fill="#4f8cff">Edge</text>
  </g>
</svg>
